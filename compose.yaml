services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-istore}
      DB_USER: ${DB_USER:-istore}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      APP_SECRET: ${APP_SECRET:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-25}
      AI_ENABLED: ${AI_ENABLED:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_RATE_SECRET: ${AI_RATE_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-istore}
      MYSQL_USER: ${DB_USER:-istore}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/upgrade_ai_assistant.sql:/docker-entrypoint-initdb.d/03-ai.sql:ro
      - ./database/upgrade_v1.sql:/docker-entrypoint-initdb.d/04-v1.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
